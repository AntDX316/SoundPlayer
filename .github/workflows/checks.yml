name: Sound Player checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm audit
      - run: npm run test:unit
      - run: npm test
      - run: npm run build:unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged executable
        run: npm test
        env:
          SOUNDPLAYER_EXECUTABLE: '${{ github.workspace }}\dist\win-unpacked\Sound Player.exe'
